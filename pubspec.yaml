
  name: ai_saas
  description: "A new Flutter project."

  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.9.2

  dependencies:
    flutter:
      sdk: flutter

    cupertino_icons: ^1.0.8

    # Typography
    google_fonts: ^6.2.1

    # SVG icons
    flutter_svg: ^2.0.10+1

    # Charts
    fl_chart: ^0.70.2

    # Media & files
    image_picker: ^1.2.2
    file_picker: ^11.0.3

    # Utilities
    url_launcher: ^6.3.1

    # Speech recognition
    speech_to_text: ^7.4.0
    go_router: ^17.2.3

  dev_dependencies:
    flutter_test:
      sdk: flutter

    flutter_lints: ^5.0.0

    # App launcher icon
    flutter_launcher_icons: ^0.14.4

  flutter:
    uses-material-design: true

    assets:
      - assets/icons/
      - assets/logo/

  # App Launcher Icon Configuration
  flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/logo/logo.png"
    adaptive_icon_background: "#FFFFFF"
    adaptive_icon_foreground: "assets/logo/logo.png"
    remove_alpha_ios: true

